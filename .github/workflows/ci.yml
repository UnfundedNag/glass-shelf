name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Typechecks, builds and packs. No SERVER_ORIGIN in CI, so the package
      # carries the placeholder whitelist; self-hosters pack their own.
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: glass-shelf-ehpk
          path: glass-shelf.ehpk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: glass-shelf-ehpk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" glass-shelf.ehpk --repo "$GITHUB_REPOSITORY" --generate-notes
