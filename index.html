<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Glass Shelf</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <h1>Glass Shelf</h1>

      <section>
        <h2>Server</h2>
        <form id="settings" autocomplete="off">
          <label>Calibre-Web URL
            <input name="url" type="url" inputmode="url" placeholder="https://books.example.com" required />
          </label>
          <label>Username
            <input name="username" autocapitalize="off" autocorrect="off" spellcheck="false" required />
          </label>
          <label>Password
            <input name="password" type="password" />
          </label>
          <button type="submit">Save and test</button>
        </form>
        <p id="settings-status" class="status" role="status"></p>
        <p class="status">This app's origin is <code id="app-origin"></code>. Your server's CORS headers must allow it.</p>
      </section>

      <section id="search-section" hidden>
        <h2>Search</h2>
        <form id="search">
          <input name="q" type="search" placeholder="Title or author" required />
          <button type="submit">Search</button>
        </form>
        <p id="search-status" class="status" role="status"></p>
        <ul id="results"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
